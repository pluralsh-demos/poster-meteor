apiVersion: batch/v1
kind: Job
metadata:
  name: poster-meteor-migrate
  labels:
    {{- include "poster-meteor.workloadLabels" (dict "root" . "name" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "poster-meteor.workloadLabels" (dict "root" . "name" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: {{ include "poster-meteor.api.image" . | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
{{ include "poster-meteor.db.script" (dict "skipIfUnset" true "steps" (list "exec node apps/api/dist/migrate.js")) | indent 14 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "poster-meteor.databaseSecret" . }}
                  key: uri
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
