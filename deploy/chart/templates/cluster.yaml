apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "poster-meteor.clusterName" . }}
  labels:
    {{- include "poster-meteor.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  postgresql:
    parameters:
      max_connections: {{ include "poster-meteor.postgres.maxConnections" . }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database | quote }}
      owner: {{ .Values.postgres.owner | quote }}
  storage:
    size: {{ .Values.postgres.storage.size }}
