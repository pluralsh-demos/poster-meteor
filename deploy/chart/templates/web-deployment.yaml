apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "poster-meteor.workloadLabels" (dict "root" . "name" "web") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "poster-meteor.workloadSelectorLabels" (dict "root" . "name" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poster-meteor.workloadLabels" (dict "root" . "name" "web") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: {{ include "poster-meteor.web.image" . | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
