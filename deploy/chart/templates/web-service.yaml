apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "poster-meteor.workloadLabels" (dict "root" . "name" "web") | nindent 4 }}
spec:
  selector:
    {{- include "poster-meteor.workloadSelectorLabels" (dict "root" . "name" "web") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
