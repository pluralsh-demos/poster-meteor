apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "poster-meteor.workloadLabels" (dict "root" . "name" "api") | nindent 4 }}
spec:
  selector:
    {{- include "poster-meteor.workloadSelectorLabels" (dict "root" . "name" "api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
