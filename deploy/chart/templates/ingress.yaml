apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poster-meteor
  labels:
    {{- include "poster-meteor.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ include "poster-meteor.hostname" . }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ include "poster-meteor.hostname" . }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
