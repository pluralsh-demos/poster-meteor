server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Demo hosts must stay out of search indexes.
    add_header X-Robots-Tag "noindex" always;

    # Client routes (/, /products/:sku, /cart, /checkout, /orders/:number)
    # have no files of their own. Real assets, including /posters, are served
    # when the file exists.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
