name: Follow-up

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  followup:
    # Slot repos set PLURAL_CONSOLE_URL. This template stays green until then.
    if: github.event.pull_request.merged == true && vars.PLURAL_CONSOLE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Plural
        uses: pluralsh/setup-plural@v2
        with:
          consoleUrl: ${{ vars.PLURAL_CONSOLE_URL }}
          email: ${{ vars.PLURAL_CONSOLE_EMAIL }}
          vsn: 0.12.60

      - name: Follow up on the merged pull request
        id: follow-up
        uses: pluralsh/workbench-followup-action@v1
        with:
          prompt: |
            Pull request #${{ github.event.pull_request.number }} was merged into ${{ github.event.pull_request.base.ref }}.
            Git sync, the rolling update, the migrate hook, and the seed hook should have settled.
            Check the merged pull request against the API and web rollout, confirm the expected change is working, and fix any issues you find.
          defer: 5m
          skip-missing: true

      - name: Print Workbench job
        if: steps.follow-up.outputs.skipped != 'true'
        run: echo '${{ steps.follow-up.outputs.workbench-job-url }}'
