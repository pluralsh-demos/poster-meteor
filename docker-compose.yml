services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: poster
      POSTGRES_PASSWORD: poster
      POSTGRES_DB: poster_meteor
    command: ["postgres", "-c", "max_connections=60"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poster -d poster_meteor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://poster:poster@postgres:5432/poster_meteor
      POOL_MAX: "8"
      PACK: poster-meteor
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if node --input-type=module -e 'import net from "node:net"; const url = new URL(process.env.DATABASE_URL ?? ""); const socket = net.connect({ host: url.hostname, port: Number(url.port || 5432) }); const done = (code) => { socket.destroy(); process.exit(code); }; socket.setTimeout(2000); socket.on("connect", () => done(0)); socket.on("timeout", () => done(2)); socket.on("error", () => done(2));'; then
          node apps/api/dist/migrate.js && node apps/api/dist/seed.js || exit 1
        else
          echo "postgres is not running; serving the catalog without orders" >&2
        fi
        exec node apps/api/dist/index.js

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
